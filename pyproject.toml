[project]
name = "ai-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "Dmitry globa",email = "dima.globa2015@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "customtkinter (>=6.0.0,<7.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pathspec (>=1.1.1,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "jinja2 (>=3.1.6,<4.0.0)"
]

[tool.poetry]
packages = [{include = "ai_assistant", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.8,<0.17.0)"
]
